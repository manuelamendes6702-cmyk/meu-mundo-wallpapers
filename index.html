<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d987b5">
<meta name="description" content="Papéis de parede fofos, românticos, elegantes e muito mais.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Meu Mundo de Wallpapers</title>
<style>
:root{--pink:#d987b5;--ink:#542b50;--bg:#fff8fc;--card:#fff;--muted:#806d7b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:26px 20px 22px;background:linear-gradient(135deg,#f7c7df,#d8c7f4);border-radius:0 0 28px 28px}
header .eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800}h1{font-size:25px;margin:8px 0 5px}header p{margin:0;font-size:14px}
main{max-width:760px;margin:auto;padding:20px 16px 100px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}.heading h2{font-size:18px;margin:0}
.pills{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.pill{border:1px solid #ead7e5;background:white;border-radius:30px;padding:9px 14px;white-space:nowrap;color:var(--ink);font-size:13px}.pill.active{background:var(--pink);color:white;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wall{position:relative;border:0;border-radius:17px;min-height:210px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:white;cursor:pointer;box-shadow:0 5px 16px #50304a18}
.wall .emoji{font-size:64px;filter:drop-shadow(0 3px 5px #0003)}.wall .name{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:700;text-shadow:0 1px 5px #0008}
.heart{position:absolute;right:9px;top:9px;border:0;border-radius:50%;width:34px;height:34px;background:#ffffffdf;color:#ad4d87;font-size:19px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffF;border-top:1px solid #eedee9;display:flex;justify-content:space-around;padding:12px 8px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
nav button{border:0;background:none;color:var(--ink);font-size:12px;display:grid;gap:3px;justify-items:center}nav b{font-size:19px}
.empty{grid-column:1/-1;text-align:center;padding:35px 15px;color:var(--muted);background:white;border-radius:16px}
.modal{position:fixed;inset:0;background:#170d1acc;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.sheet{width:min(100%,390px);background:white;border-radius:22px;padding:14px;text-align:center}
.preview{height:min(65vh,570px);border-radius:16px;display:grid;place-items:center;color:white;font-size:90px;position:relative}.sheet h3{margin:12px}.actions{display:flex;gap:9px}.actions button{flex:1;border:0;border-radius:30px;padding:12px;background:var(--pink);color:white;font-weight:700}.actions .secondary{background:#f3e8f0;color:var(--ink)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:22px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wall{min-height:250px}}
</style>
</head>
<body>
<header><div class="eyebrow">SEU CANTINHO DE INSPIRAÇÃO ✨</div><h1>Meu Mundo de Wallpapers</h1><p>Deixe seu celular com a sua cara! 💗</p></header>
<main>
 <div class="heading"><h2 id="sectionTitle">Explore os papéis de parede</h2><span id="total" style="font-size:12px;color:var(--muted)"></span></div>
 <div class="pills" id="categories"></div>
 <section class="grid" id="gallery" aria-live="polite"></section>
 <footer>Feito com carinho 💕</footer>
</main>
<nav><button id="home"><b>🏠</b>Início</button><button id="favorites"><b>💗</b>Favoritos</button><button id="about"><b>✨</b>Sobre</button></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Visualização do papel de parede">
 <div class="sheet"><div class="preview" id="preview"></div><h3 id="previewName"></h3><div class="actions"><button class="secondary" id="close">Voltar</button><button id="save">♡ Favoritar</button><button id="download">Baixar</button></div></div>
</div>
<script>
const wallpapers=[
 {name:"Jardim de Rosas",cat:"Flores",emoji:"🌹",bg:"linear-gradient(145deg,#6c2348,#ed9bbd)"},
 {name:"Flores de Primavera",cat:"Flores",emoji:"🌸",bg:"linear-gradient(145deg,#e99ab9,#f8d6e6)"},
 {name:"Amor em Rosa",cat:"Amor",emoji:"💗",bg:"linear-gradient(145deg,#e65e9a,#f4b6d0)"},
 {name:"Coração Encantado",cat:"Amor",emoji:"💕",bg:"linear-gradient(145deg,#762b59,#e889b5)"},
 {name:"Luxo Dourado",cat:"Luxo",emoji:"👑",bg:"linear-gradient(145deg,#34251a,#b98c43)"},
 {name:"Noite de Cristal",cat:"Luxo",emoji:"✨",bg:"linear-gradient(145deg,#25223e,#8d7cae)"},
 {name:"Borboletas",cat:"Natureza",emoji:"🦋",bg:"linear-gradient(145deg,#5d6da7,#c5a8e8)"},
 {name:"Céu dos Sonhos",cat:"Natureza",emoji:"🌙",bg:"linear-gradient(145deg,#142f59,#78b9dc)"},
 {name:"Gatinho Fofo",cat:"Fofos",emoji:"🐱",bg:"linear-gradient(145deg,#d5a58c,#f5d9bb)"},
 {name:"Ursinho Doce",cat:"Fofos",emoji:"🧸",bg:"linear-gradient(145deg,#98765e,#e9c7a5)"}
];
let category="Todos",onlyFavorites=false,selected=0;
let favorites=JSON.parse(localStorage.getItem("wallpaper-favorites")||"[]");
const $=id=>document.getElementById(id);
const categories=["Todos","Flores","Amor","Luxo","Natureza","Fofos"];
function render(){
 $("categories").innerHTML="";
 categories.forEach(c=>{const b=document.createElement("button");b.className="pill"+(category===c?" active":"");b.textContent=({Todos:"✨ Todos",Flores:"🌸 Flores",Amor:"💗 Amor",Luxo:"👑 Luxo",Natureza:"🦋 Natureza",Fofos:"🐱 Fofos"})[c];b.onclick=()=>{category=c;onlyFavorites=false;render()};$("categories").append(b)});
 $("sectionTitle").textContent=onlyFavorites?"Meus favoritos":"Explore os papéis de parede";
 const items=wallpapers.map((w,i)=>({...w,i})).filter(w=>(category==="Todos"||w.cat===category)&&(!onlyFavorites||favorites.includes(w.i)));
 $("total").textContent=items.length+" imagens";
 $("gallery").innerHTML="";
 if(!items.length){$("gallery").innerHTML='<div class="empty">Você ainda não salvou favoritos.<br>Toque no coração de um wallpaper! 💗</div>';return}
 items.forEach(w=>{const card=document.createElement("div");card.className="wall";card.style.background=w.bg;card.innerHTML=`<span class="emoji">${w.emoji}</span><span class="name">${w.name}</span><button class="heart" aria-label="Favoritar">${favorites.includes(w.i)?"♥":"♡"}</button>`;card.onclick=()=>open(w.i);card.querySelector(".heart").onclick=e=>{e.stopPropagation();toggle(w.i)};$("gallery").append(card)});
}
function toggle(i){favorites=favorites.includes(i)?favorites.filter(x=>x!==i):[...favorites,i];localStorage.setItem("wallpaper-favorites",JSON.stringify(favorites));render();if($("modal").classList.contains("open"))updateModal()}
function open(i){selected=i;updateModal();$("modal").classList.add("open")}
function updateModal(){const w=wallpapers[selected];$("preview").style.background=w.bg;$("preview").textContent=w.emoji;$("previewName").textContent=w.name;$("save").textContent=favorites.includes(selected)?"♥ Salvo":"♡ Favoritar"}
$("home").onclick=()=>{category="Todos";onlyFavorites=false;render()};
$("favorites").onclick=()=>{category="Todos";onlyFavorites=true;render()};
$("about").onclick=()=>alert("Meu Mundo de Wallpapers 💕\nUm cantinho para escolher e guardar fundos lindos para seu celular.");
$("close").onclick=()=>$("modal").classList.remove("open");
$("save").onclick=()=>toggle(selected);
$("download").onclick=()=>{const w=wallpapers[selected];const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6c2348"/><stop offset="1" stop-color="#ed9bbd"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="540" y="990" text-anchor="middle" font-size="230">${w.emoji}</text><text x="540" y="1120" text-anchor="middle" fill="white" font-size="48" font-family="sans-serif">${w.name}</text></svg>`;const blob=new Blob([svg],{type:"image/svg+xml"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=w.name.toLowerCase().replaceAll(" ","-")+".svg";a.click();URL.revokeObjectURL(a.href)};
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))$("modal").classList.remove("open")});
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
